<title>心保部干事课表</title>
<style>
  :root {
    color-scheme: light;
    font: 15px/1.55 system-ui, 'Microsoft YaHei', sans-serif;
    color: #334166;
    background: #f7f8ff;
    --accent: #165751;
    --line: #d9e2ef;
    --muted: #455571;
    --amber: #78450b;
    --focus: #5047ad;
    --soft-shadow: 0 12px 32px #2a437b18, 0 2px 6px #2a437b0d;
  }
  * { box-sizing: border-box; }
  body {
    min-height: 100vh;
    margin: 0;
    background:
      radial-gradient(ellipse 440px 275px at 91% 75px, #c2f8fb, transparent),
      radial-gradient(ellipse 600px 340px at 8% 20px, #e0d9ff, transparent),
      radial-gradient(ellipse 490px 290px at 65% 350px, #fce4f3, transparent),
      linear-gradient(152deg, #f1f5ff, #fafbff 75%);
  }
  main { width: min(1450px, 100%); margin: auto; padding: 32px clamp(14px, 3vw, 44px); }
  h1, h2, p { margin: 0; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.75rem); line-height: 1.18; letter-spacing: -.025em; margin: 9px 0 7px; }
  .glass {
    border: 1px solid #fff;
    background-color: #f3f7ff;
    box-shadow: var(--soft-shadow), inset 0 1px 0 #fff;
  }
  .overview { position: relative; isolation: isolate; overflow: hidden; border-radius: 24px; padding: clamp(15px, 2.4vw, 30px); margin-bottom: 14px; }
  .overview::before {
    content: '';
    position: absolute;
    z-index: -1;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 86% 16%, #fff 0 3px, transparent 4px),
      radial-gradient(circle at 63% 32%, #fff 0 2px, transparent 3px),
      repeating-radial-gradient(ellipse 250px 100px at 83% -13%, transparent 0 15%, #fff9 15.4% 15.9%, transparent 16.3% 25%);
  }
  .overview-main { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 15px 28px; }
  .term { display: inline-block; padding: 3px 10px; border: 1px solid #fff; border-radius: 20px; background: #f1edff; color: #514696; font-size: .78rem; font-weight: 700; }
  .subtle { color: var(--muted); }
  .filters { display: flex; flex-wrap: wrap; align-items: end; gap: 10px 14px; }
  label { display: grid; gap: 4px; font-size: .88rem; font-weight: 700; }
  .week-control { display: flex; align-items: end; gap: 4px; }
  button, select { font: inherit; color: inherit; }
  .control, select { border: 1px solid #8490ac; border-radius: 11px; background: #fcfbff; padding: 7px 10px; min-height: 40px; }
  .control:not(:disabled):hover, select:hover { background: #e9efff; border-color: var(--focus); }
  .week-control .control { min-width: 32px; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .overview-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 20px; margin-top: 16px; padding-top: 10px; border-top: 1px solid #8f9ec555; }
  .date { color: #334888; font-weight: 700; font-variant-numeric: tabular-nums; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .85rem; }
  .busy { color: var(--accent); }
  .pending { color: var(--amber); }
  .schedule { max-height: min(70vh, 780px); overflow: auto; border: 1px solid #c6d2e6; border-radius: 18px; background: #fff; box-shadow: var(--soft-shadow); }
  table { border-collapse: separate; border-spacing: 0; table-layout: fixed; width: 100%; }
  table.week { min-width: 880px; }
  th, td { border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
  tr > :last-child { border-right: 0; }
  tbody tr:last-child > * { border-bottom: 0; }
  thead th { position: sticky; z-index: 2; top: 0; padding: 8px 4px; background: #f0f0fd; }
  thead th:first-child, tbody th { position: sticky; left: 0; width: 96px; }
  thead th:first-child { z-index: 3; }
  tbody th { z-index: 1; background: #f1f5fd; font-size: .87rem; }
  tbody tr.section > * { border-top: 2px solid #bdcce1; }
  .week thead th:nth-last-child(-n+2) { background: #edf3fb; }
  .week td:nth-last-child(-n+2) { background: #f8faff; }
  .day-date, .period-time { display: block; font-size: .78rem; font-weight: 400; color: var(--muted); }
  .period-time { white-space: nowrap; font-variant-numeric: tabular-nums; }
  td { vertical-align: top; padding: 0; }
  .slot { width: 100%; height: 100%; min-height: 60px; display: flex; flex-direction: column; align-items: start; gap: 2px; border: 0; background: transparent; text-align: left; padding: 8px; }
  .slot:hover { background: #edf3fc; }
  .slot:focus-visible { outline-offset: -3px; }
  .slot strong { font-size: .83rem; }
  .names { display: flex; flex-wrap: wrap; font-size: .84rem; line-height: 1.6; }
  .names span { white-space: nowrap; }
  .slot .pending { font-size: .8rem; }
  .sources { margin-top: 14px; padding: 12px 16px; background: #f8faff; border: 1px solid #d4dfef; border-radius: 14px; }
  summary { cursor: pointer; font-weight: 700; }
  .sources li, dialog li { margin: 4px 0; }
  dialog { width: min(620px, calc(100% - 26px)); max-height: 85vh; border-radius: 22px; padding: clamp(15px, 3vw, 24px); color: inherit; }
  dialog::backdrop { background: #18274b66; }
  .dialog-head { display: flex; justify-content: space-between; align-items: start; gap: 10px; }
  dialog h2 { font-size: 1.2rem; }
  dialog h3 { font-size: 1rem; margin: 16px 0 4px; }
  dialog ul { padding-left: 1.35em; margin: 0; }
  .mobile-days, .mobile-agenda { display: none; }
  @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass {
      background-color: rgb(247 250 255 / .66);
      -webkit-backdrop-filter: blur(15px) saturate(125%);
      backdrop-filter: blur(15px) saturate(125%);
    }
    dialog.glass { background-color: rgb(248 251 255 / .86); }
  }
  @media (prefers-reduced-transparency: reduce), (forced-colors: active) {
    .glass, dialog.glass {
      background-color: #f3f7ff;
      -webkit-backdrop-filter: none;
      backdrop-filter: none;
    }
  }
  @media (max-width: 650px) {
    main { padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); }
    .overview { border-radius: 21px; padding: 14px; margin-bottom: 9px; }
    .filters { justify-content: space-between; width: 100%; gap: 8px; }
    .filters .control, .filters select { min-height: 44px; padding-inline: 6px; font-size: 16px; }
    .week-control .control { width: 37px; }
    .desktop-day, .schedule { display: none; }
    .overview-meta { gap: 3px 12px; margin-top: 11px; padding-top: 8px; }
    .mobile-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin: 0 0 10px; }
    .mobile-days button { min-height: 49px; padding: 3px 0; border: 1px solid #d1dbee; border-radius: 12px; background: #fcfdff; font-weight: 700; }
    .mobile-days button[aria-pressed='true'] { border-color: #867cd2; background: #eeeaff; color: #4a3c91; box-shadow: inset 0 -3px 0 #c5b8ff; }
    .mobile-days small { display: block; font-size: .75rem; font-weight: 500; font-variant-numeric: tabular-nums; }
    .mobile-agenda { display: grid; gap: 7px; list-style: none; padding: 0; margin: 0; }
    .mobile-agenda .section { margin-top: 8px; }
    .mobile-agenda .slot { display: grid; grid-template-columns: 78px minmax(0, 1fr) 12px; align-items: center; gap: 8px; min-height: 54px; padding: 8px 10px; border: 1px solid #dce4f1; border-radius: 15px; background: #fcfdff; }
    .mobile-agenda .slot.has-class { background: #fff; border-left: 3px solid #9adfd5; }
    .mobile-agenda .slot:active { background: #f1edff; }
    .mobile-agenda .slot::after { content: '›'; color: #665ba3; justify-self: end; }
    .mobile-period { display: block; border-right: 1px solid var(--line); font-size: .9rem; font-weight: 700; }
    .mobile-agenda .names { font-size: .9rem; }
    dialog { inset: auto 0 0; margin: 0 auto; max-height: 78vh; width: 100%; max-width: 100%; border-radius: 22px 22px 0 0; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
  }
</style>
<main>
  <section class="overview glass" aria-labelledby="schedule-title">
    <div class="overview-main">
      <header>
        <p class="term">2026–2027 学年 · 第一学期</p>
        <h1 id="schedule-title">心保部干事课表</h1>
        <p class="subtle">14 人 · 按教学周查询每节课的上课名单</p>
      </header>
      <div class="filters">
        <div class="week-control">
          <button id="previous" class="control" aria-label="上一周">‹</button>
          <label>教学周<select id="week"></select></label>
          <button id="next" class="control" aria-label="下一周">›</button>
        </div>
        <label class="desktop-day">星期<select id="day"></select></label>
        <label>姓名<select id="person"></select></label>
      </div>
    </div>
    <div class="overview-meta">
      <p id="dates" class="date" aria-live="polite"></p>
      <p class="legend"><span class="busy">● 有课</span><span class="pending">● 待确认</span><span class="subtle">○ 课表未排课（仅按现有资料）</span></p>
    </div>
  </section>
  <nav id="mobile-days" class="mobile-days" aria-label="选择星期"></nav>
  <ol id="mobile-agenda" class="mobile-agenda" aria-label="当天课表"></ol>
  <div class="schedule" tabindex="0" aria-label="可滚动的课表"><table id="schedule" aria-label="按星期和节次汇总的课表"></table></div>
  <details class="sources">
    <summary>资料来源和核对说明</summary>
    <p class="subtle">教学周从 2026 年 9 月 14 日起算。按常规课表显示，忽略调课。未排定星期和节次的其他课程、自习和社团活动未纳入统计。</p>
    <p class="subtle">第 10 节全员无课，周末只显示庞世金的排课。</p>
    <p class="subtle">节次起止时间见<a href="https://jwc.hqu.edu.cn/info/1001/1013.htm">华侨大学教务处作息时间表</a>。</p>
    <ul id="sources"></ul>
  </details>
  <noscript>请启用浏览器的 JavaScript 以查询课表。</noscript>
</main>
<dialog id="detail" class="glass" aria-labelledby="detail-title" aria-describedby="detail-time">
  <div class="dialog-head"><div><h2 id="detail-title"></h2><p id="detail-time" class="subtle"></p></div><form method="dialog"><button class="control" autofocus>关闭</button></form></div>
  <div id="detail-content"></div>
</dialog>

const weekdays = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const periodTimes = [
  '08:00–08:45', '08:55–09:40', '10:00–10:45', '10:55–11:40', '11:45–12:30',
  '14:30–15:15', '15:25–16:10', '16:20–17:05', '17:15–18:00',
  '18:20–19:05', '19:10–19:55', '20:05–20:50', '20:55–21:40',
];
const termStart = Date.UTC(2026, 8, 14);
const dayMs = 86_400_000;
const maxWeek = 16;
const range = (first, last) => Array.from({ length: last - first + 1 }, (_, index) => first + index);
const people = sources.map(([name]) => name);
const sourceByName = new Map(sources.map(([name, file, , note]) => [name, { file, note }]));
const sharedSchedules = new Map([['杨帆', '张鑫梦']]);

function parseRange(value, maximum) {
  const match = /^(\d+)(?:-(\d+))?$/.exec(value);
  if (!match) throw new Error(`无法读取范围 ${value}`);
  const first = Number(match[1]);
  const last = Number(match[2] ?? match[1]);
  if (first < 1 || last < first || last > maximum) throw new Error(`范围越界 ${value}`);
  return range(first, last);
}

function expandWeeks(value) {
  return [...new Set(value.split(',').flatMap(part => {
    const parity = part.endsWith('单') ? 1 : part.endsWith('双') ? 0 : null;
    const span = parity === null ? part : part.slice(0, -1);
    return parseRange(span, maxWeek).filter(week => parity === null || week % 2 === parity);
  }))];
}

const lessons = sources.filter(([, , records]) => records).flatMap(([name, , records]) => records.trim().split('\n').flatMap(line => {
  const [when, course, location = ''] = line.split('|');
  const [weekday, periodText, weekText] = when.split(' ');
  const day = Number(weekday);
  if (!weekdays[day - 1] || !course) throw new Error(`课程记录不完整 ${line}`);
  const periods = parseRange(periodText, periodTimes.length);
  return expandWeeks(weekText).map(week => ({ name, week, day, periods, course, location }));
}));

const slotKey = (week, day, period) => `${week}/${day}/${period}`;
const slots = new Map();
for (const week of range(1, maxWeek)) {
  for (const day of range(1, 7)) {
    for (const period of range(1, periodTimes.length)) {
      slots.set(slotKey(week, day, period), { courses: new Map(), notes: new Map() });
    }
  }
}

function addNote(names, weeks, days, periods, message) {
  for (const week of weeks) {
    for (const day of days) {
      for (const period of periods) {
        const { notes } = slots.get(slotKey(week, day, period));
        for (const name of names) notes.set(name, [...(notes.get(name) ?? []), message]);
      }
    }
  }
}

const allWeeks = range(1, maxWeek);
const allDays = range(1, 7);
const allPeriods = range(1, periodTimes.length);
addNote(['王春晓'], allWeeks, [3], [1, 2], '原图显示「更多」，折叠课程的周次未知。');

for (const lesson of lessons) {
  const { name, week, day, periods, course, location } = lesson;
  if (day >= 6 && name !== '庞世金') continue;
  const periodText = periods.length === 1 ? `${periods[0]}` : `${periods[0]}–${periods.at(-1)}`;
  const description = `${course} · 第 ${periodText} 节${location ? ` · ${location}` : ''}`;
  for (const period of periods) {
    if (period === 10) continue;
    const { courses } = slots.get(slotKey(week, day, period));
    if (!courses.has(name)) courses.set(name, new Set());
    courses.get(name).add(description);
  }
}

for (const [name, sharedWith] of sharedSchedules) {
  for (const { courses, notes } of slots.values()) {
    if (courses.has(sharedWith)) courses.set(name, courses.get(sharedWith));
    if (notes.has(sharedWith)) notes.set(name, notes.get(sharedWith));
  }
}

const byId = id => document.getElementById(id);
const weekControl = byId('week');
const dayControl = byId('day');
const personControl = byId('person');
const table = byId('schedule');
const agenda = byId('mobile-agenda');
const dialog = byId('detail');
const narrow = window.matchMedia('(max-width: 650px)');

function dateAt(week, day) {
  return new Date(termStart + ((week - 1) * 7 + day - 1) * dayMs);
}

function formatDate(date) {
  return `${date.getUTCMonth() + 1} 月 ${date.getUTCDate()} 日`;
}

function addOption(select, value, label) {
  select.add(new Option(label, value));
}

for (const week of allWeeks) addOption(weekControl, week, `第 ${week} 周`);
addOption(dayControl, 0, '整周');
weekdays.forEach((day, index) => addOption(dayControl, index + 1, day));
addOption(personControl, '', '全部 14 人');
for (const name of people) addOption(personControl, name, name);

const campusNow = new Date(Date.now() + 8 * 60 * 60 * 1000);
const currentWeek = 1 + Math.floor((campusNow.getTime() - termStart) / (7 * dayMs));
const currentDay = campusNow.getUTCDay() || 7;
const inTerm = allWeeks.includes(currentWeek);
weekControl.value = inTerm ? currentWeek : 1;
dayControl.value = 0;

const dayTabs = allDays.map(day => {
  const button = appendText(byId('mobile-days'), 'button', '', weekdays[day - 1]);
  button.type = 'button';
  button.addEventListener('click', () => {
    dayControl.value = day;
    render();
  });
  return { button, date: appendText(button, 'small', '', '') };
});

for (const [name, { file, note }] of sourceByName) {
  const item = document.createElement('li');
  item.textContent = `${name} · ${file}${note ? ` · ${note}` : ''}`;
  byId('sources').append(item);
}

function statusFor(week, day, period, names) {
  const { courses, notes } = slots.get(slotKey(week, day, period));
  return {
    courses, notes,
    busy: names.filter(name => courses.has(name)),
    pending: names.filter(name => !courses.has(name) && notes.has(name)),
    clear: names.filter(name => !courses.has(name) && !notes.has(name)),
  };
}

function appendText(parent, tag, className, value) {
  const element = document.createElement(tag);
  element.className = className;
  element.textContent = value;
  parent.append(element);
  return element;
}

function showDetail(week, day, period, status) {
  byId('detail-title').textContent = `第 ${week} 周 · ${weekdays[day - 1]} · 第 ${period} 节`;
  byId('detail-time').textContent = periodTimes[period - 1];
  const content = byId('detail-content');
  content.replaceChildren();
  const groups = [
    ['有课', 'busy', status.busy],
    ['待确认', 'pending', status.pending],
    ['课表未排课', 'subtle', status.clear],
  ];
  for (const [label, color, names] of groups) {
    appendText(content, 'h3', color, `${label} · ${names.length} 人`);
    if (!names.length) continue;
    if (label === '课表未排课') {
      appendText(content, 'p', '', names.join('、'));
      continue;
    }
    const list = document.createElement('ul');
    content.append(list);
    for (const name of names) {
      const item = document.createElement('li');
      list.append(item);
      const detail = [...(status.courses.get(name) ?? []), ...(status.notes.get(name) ?? [])];
      appendText(item, 'strong', '', `${name} `);
      item.append(detail.join(' / '));
      const sharedWith = sharedSchedules.get(name);
      const file = sourceByName.get(sharedWith ?? name).file;
      appendText(item, 'div', 'subtle', `来源 ${file}${sharedWith ? `（与${sharedWith}课表相同）` : ''}`);
    }
  }
  dialog.showModal();
}

function renderSlot(parent, week, day, period, names, isCard = false) {
  const status = statusFor(week, day, period, names);
  const button = appendText(parent, 'button', status.busy.length ? 'slot has-class' : 'slot', '');
  button.type = 'button';
  button.setAttribute('aria-haspopup', 'dialog');
  button.setAttribute('aria-label', `${weekdays[day - 1]}第 ${period} 节，${status.busy.length} 人有课，${status.pending.length} 人待确认，查看详情`);
  if (isCard) {
    const label = appendText(button, 'span', 'mobile-period', `第 ${period} 节`);
    appendText(label, 'span', 'period-time', periodTimes[period - 1]);
  }
  const summary = isCard ? appendText(button, 'span', '', '') : button;
  if (status.busy.length) {
    appendText(summary, 'strong', 'busy', `${status.busy.length} 人有课`);
    const roster = appendText(summary, 'span', 'names', '');
    status.busy.forEach((name, index) => appendText(roster, 'span', '', index < status.busy.length - 1 ? `${name}、` : name));
  }
  if (status.pending.length) {
    const pendingText = names.length === 1 ? '待确认' : `${status.pending.length} 人待确认`;
    appendText(summary, 'span', 'pending', pendingText);
  }
  if (!status.busy.length && !status.pending.length) appendText(summary, 'span', 'subtle', '课表未排课');
  button.addEventListener('click', () => showDetail(week, day, period, status));
}

function render() {
  const week = Number(weekControl.value);
  const dayFilter = Number(dayControl.value) || (narrow.matches ? (week === currentWeek ? currentDay : 1) : 0);
  const days = dayFilter ? [dayFilter] : allDays;
  const names = personControl.value ? [personControl.value] : people;
  byId('previous').disabled = week === 1;
  byId('next').disabled = week === maxWeek;
  byId('dates').textContent = dayFilter
    ? `${weekdays[dayFilter - 1]} · ${formatDate(dateAt(week, dayFilter))}`
    : `${formatDate(dateAt(week, 1))} – ${formatDate(dateAt(week, 7))}`;

  table.replaceChildren();
  agenda.replaceChildren();
  if (narrow.matches) {
    dayTabs.forEach(({ button, date }, index) => {
      const day = index + 1;
      const dayDate = dateAt(week, day);
      button.setAttribute('aria-pressed', day === dayFilter);
      button.setAttribute('aria-label', `${weekdays[index]} ${formatDate(dayDate)}`);
      date.textContent = dayDate.getUTCDate();
    });
    for (const period of allPeriods) {
      const card = appendText(agenda, 'li', [6, 10].includes(period) ? 'section' : '', '');
      renderSlot(card, week, dayFilter, period, names, true);
    }
    return;
  }

  table.className = dayFilter ? '' : 'week';
  const header = table.createTHead().insertRow();
  appendText(header, 'th', '', '节次').scope = 'col';
  for (const day of days) {
    const cell = appendText(header, 'th', '', weekdays[day - 1]);
    cell.scope = 'col';
    appendText(cell, 'span', 'day-date', formatDate(dateAt(week, day)));
  }

  const body = table.createTBody();
  for (const period of allPeriods) {
    const row = body.insertRow();
    if ([6, 10].includes(period)) row.className = 'section';
    const periodHeader = appendText(row, 'th', '', `第 ${period} 节`);
    periodHeader.scope = 'row';
    appendText(periodHeader, 'span', 'period-time', periodTimes[period - 1]);
    for (const day of days) {
      renderSlot(row.insertCell(), week, day, period, names);
    }
  }
}

for (const control of [weekControl, dayControl, personControl]) control.addEventListener('change', render);
narrow.addEventListener('change', render);
byId('previous').addEventListener('click', () => { weekControl.selectedIndex -= 1; render(); });
byId('next').addEventListener('click', () => { weekControl.selectedIndex += 1; render(); });
render();
</script>
